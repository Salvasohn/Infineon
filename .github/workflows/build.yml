name: Firmware build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  ARM_GNU_VERSION: 14.2.rel1
  ARM_GNU_SHA256: 62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823
  ARM_GNU_URL: https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz

jobs:
  build:
    name: Build ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - release

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Install Arm GNU Toolchain 14.2.rel1
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/arm-gnu-toolchain.tar.xz"
          install_dir="${RUNNER_TEMP}/arm-gnu-toolchain"

          curl --fail --location --retry 3 --output "${archive}" "${ARM_GNU_URL}"
          echo "${ARM_GNU_SHA256}  ${archive}" | sha256sum --check

          mkdir -p "${install_dir}"
          tar -xJf "${archive}" -C "${install_dir}" --strip-components=1
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

          export PATH="${install_dir}/bin:${PATH}"
          test "$(arm-none-eabi-g++ -dumpfullversion)" = "14.2.1"
          arm-none-eabi-g++ --version
          cmake --version
          ninja --version

      - name: Configure ${{ matrix.preset }}
        shell: bash
        run: cmake --preset "${{ matrix.preset }}" --fresh

      - name: Build ${{ matrix.preset }}
        shell: bash
        run: cmake --build --preset "${{ matrix.preset }}" --verbose

      - name: Verify firmware artifacts
        shell: bash
        run: |
          set -euo pipefail
          build_dir="build/${{ matrix.preset }}"
          for extension in elf hex bin map; do
            test -s "${build_dir}/xmc4500_freertos_rtt.${extension}"
          done
          arm-none-eabi-size "${build_dir}/xmc4500_freertos_rtt.elf"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: xmc4500-${{ matrix.preset }}-${{ github.sha }}
          path: |
            build/${{ matrix.preset }}/xmc4500_freertos_rtt.elf
            build/${{ matrix.preset }}/xmc4500_freertos_rtt.hex
            build/${{ matrix.preset }}/xmc4500_freertos_rtt.bin
            build/${{ matrix.preset }}/xmc4500_freertos_rtt.map
          if-no-files-found: error
          retention-days: 14

  quality:
    name: clang-format + clang-tidy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install code-quality tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang-format-18 clang-tidy-18
          clang-format-18 --version
          clang-tidy-18 --version

      - name: Install Arm GNU Toolchain 14.2.rel1
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/arm-gnu-toolchain.tar.xz"
          install_dir="${RUNNER_TEMP}/arm-gnu-toolchain"

          curl --fail --location --retry 3 --output "${archive}" "${ARM_GNU_URL}"
          echo "${ARM_GNU_SHA256}  ${archive}" | sha256sum --check

          mkdir -p "${install_dir}"
          tar -xJf "${archive}" -C "${install_dir}" --strip-components=1
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

          export PATH="${install_dir}/bin:${PATH}"
          test "$(arm-none-eabi-g++ -dumpfullversion)" = "14.2.1"
          arm-none-eabi-g++ --version

      - name: Configure debug compile database
        shell: bash
        run: cmake --preset debug --fresh

      - name: Check clang-format
        shell: bash
        run: cmake --build --preset debug --target format-check --verbose

      - name: Run clang-tidy
        shell: bash
        run: cmake --build --preset debug --target tidy --verbose
